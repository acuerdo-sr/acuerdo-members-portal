name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 毎日 21:00 UTC (= 06:00 JST) に Notion 内容を取り込んで再デプロイ
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch Notion content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -n "$NOTION_TOKEN" ] && [ -f scripts/fetch_notion.py ]; then
            python scripts/fetch_notion.py
          else
            echo "NOTION_TOKEN secret 未設定 or fetcher 未実装。Notion取込スキップ。"
          fi

      - name: Build
        run: python scripts/build.py --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
