{# meta:
title: 労務年間カレンダー
body_class: aq-is-calendar
data_page: calendar
#}

<div id="aq-calendar-wrap" class="aq-subpage-wrap"><main class="aq-subpage-main">

<header class="aq-subpage-hero">
  <div class="aq-subpage-hero-text">
    <h1>労務年間カレンダー</h1>
    <p>毎月の労務・税務・社会保険関連業務の一覧。期限・対応事項を確認できます。</p>
  </div>
  <div class="aq-subpage-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
    <input type="search" id="aq-cal-q" placeholder="業務名・概要で検索" aria-label="業務を検索">
  </div>
</header>

<div class="aq-subpage-tabs" id="aq-cal-cat" role="tablist"></div>

<div class="aq-cal-months" id="aq-cal-months"></div>

<p class="aq-subpage-note">※ 業務範囲・担当区分はご契約内容により異なります。担当者にご確認ください。</p>

</main></div>

<script id="aq-cal-data" type="application/json">__CALENDAR_DATA__</script>
<script>
(function () {
  var data;
  try { data = JSON.parse(document.getElementById('aq-cal-data').textContent) || []; }
  catch (e) { data = []; }
  var months  = document.getElementById('aq-cal-months');
  var input   = document.getElementById('aq-cal-q');
  var tabsEl  = document.getElementById('aq-cal-cat');
  var state   = { cat: 'all', q: '' };

  function esc(s){return String(s == null ? '' : s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function monthOf(s) { var m = (s||'').match(/^\d{4}-(\d{2})/); return m ? parseInt(m[1],10) : 0; }
  function dayOf(s)   { var m = (s||'').match(/^\d{4}-\d{2}-(\d{2})/); return m ? parseInt(m[1],10) : 0; }
  function fmtDate(s) { var d = dayOf(s); return d ? d + '日' : ''; }

  function buildTabs() {
    var cats = {};
    data.forEach(function (r) { if (r['カテゴリ']) cats[r['カテゴリ']] = true; });
    var arr = Object.keys(cats);
    var html = '<button class="is-active" data-cat="all" type="button">すべて</button>';
    arr.forEach(function (c) {
      html += '<button data-cat="'+esc(c)+'" type="button">'+esc(c)+'</button>';
    });
    if (tabsEl) tabsEl.innerHTML = html;
  }

  function matchFilter(r) {
    if (state.cat !== 'all' && r['カテゴリ'] !== state.cat) return false;
    var q = state.q.trim().toLowerCase();
    if (!q) return true;
    var hay = (r['業務名'] || '') + ' ' + (r['概要'] || '') + ' ' + (r['カテゴリ'] || '');
    return hay.toLowerCase().indexOf(q) !== -1;
  }

  function severityClass(s) { return (s && s.indexOf('必須') !== -1) ? 'high' : 'mid'; }

  function render() {
    if (!months) return;
    var rows = data.filter(matchFilter).slice().sort(function (a, b) {
      var da = a['実施日'] || '', db = b['実施日'] || '';
      return da < db ? -1 : da > db ? 1 : 0;
    });
    if (rows.length === 0) {
      months.innerHTML = '<p class="aq-subpage-empty">該当する業務が見つかりませんでした。</p>';
      return;
    }
    var grouped = {};
    rows.forEach(function (r) { var m = monthOf(r['実施日']); (grouped[m] = grouped[m] || []).push(r); });
    var html = '';
    for (var m = 1; m <= 12; m++) {
      if (!grouped[m]) continue;
      html += '<section class="aq-cal-month-block">';
      html += '<h2 class="aq-cal-month-h"><span class="aq-cal-month-no">'+m+'</span><span class="aq-cal-month-label">月</span><span class="aq-cal-month-count">'+grouped[m].length+'件</span></h2>';
      html += '<ul class="aq-cal-items">';
      grouped[m].forEach(function (r) {
        var actions = (r['必要な対応'] || '').split(/\n/).filter(function(x){return x.trim();});
        var actionsHtml = actions.length
          ? '<ul class="aq-cal-actions">' + actions.map(function (a) {
              return '<li>' + esc(a.replace(/^[・\-•]\s*/, '')) + '</li>';
            }).join('') + '</ul>'
          : '';
        html += '<li class="aq-cal-item">' +
          '<div class="aq-cal-day"><time>'+esc(fmtDate(r['実施日']))+'</time></div>' +
          '<div class="aq-cal-body">' +
            '<header class="aq-cal-itemhead">' +
              '<span class="aq-pill aq-pill-cat">'+esc(r['カテゴリ'] || '')+'</span>' +
              '<span class="aq-pill aq-pill-sev aq-sev-'+severityClass(r['重要度'])+'">'+esc(r['重要度'] || '')+'</span>' +
              (r['担当区分'] ? '<span class="aq-pill">'+esc(r['担当区分'])+'</span>' : '') +
            '</header>' +
            '<h3 class="aq-cal-title">'+esc(r['業務名'])+'</h3>' +
            (r['概要'] ? '<p class="aq-cal-summary">'+esc(r['概要'])+'</p>' : '') +
            (actionsHtml ? '<details class="aq-cal-details"><summary>必要な対応を見る</summary>'+actionsHtml+'</details>' : '') +
          '</div>' +
        '</li>';
      });
      html += '</ul></section>';
    }
    months.innerHTML = html;
  }

  buildTabs();
  if (tabsEl) tabsEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-cat]'); if (!b) return;
    tabsEl.querySelectorAll('button').forEach(function (x) { x.classList.remove('is-active'); });
    b.classList.add('is-active');
    state.cat = b.getAttribute('data-cat');
    render();
  });
  if (input) input.addEventListener('input', function () {
    state.q = input.value || '';
    render();
  });
  render();
})();
</script>
