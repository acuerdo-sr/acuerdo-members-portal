{# meta:
title: お役立ち書式
body_class: aq-is-forms
data_page: forms
#}

<div id="aq-forms-wrap" class="aq-subpage-wrap"><main class="aq-subpage-main">

<header class="aq-subpage-hero">
  <div class="aq-subpage-hero-text">
    <p class="aq-hero-kicker">顧問先専用</p>
    <h1>お役立ち書式</h1>
    <p>労務管理で頻繁に使う各種書式をワンクリックでダウンロードできます (Word / PDF / Excel)。</p>
  </div>
</header>

<div class="aq-forms-tabs-wrap">
  <div class="aq-subpage-tabs" id="aq-forms-tabs" role="tablist"></div>
</div>

<div id="aq-forms-sections"></div>

<p class="aq-subpage-note">※ 書式は一般的なひな形です。 個別の対応が必要なケースは担当者へご相談ください。</p>

</main></div>

<script id="aq-forms-data" type="application/json">__FORMS_DATA__</script>
<script>
(function () {
  var raw;
  try { raw = JSON.parse(document.getElementById('aq-forms-data').textContent); }
  catch (e) { raw = { categories: {} }; }

  var cats     = raw.categories || {};
  var sections = document.getElementById('aq-forms-sections');
  var tabsEl   = document.getElementById('aq-forms-tabs');
  var state    = { tab: 'all' };

  function esc(s){return String(s == null ? '' : s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function urlEncodePath(p) {
    // URL-encode each path segment to handle Japanese, parens, spaces
    return (p || '').split('/').map(encodeURIComponent).join('/');
  }

  function buildTabs() {
    var tabs = [{key:'all', label:'すべて'}];
    var tpl = cats.templates || {};
    var subs = tpl.subcategories || {};
    Object.keys(subs).forEach(function (k) {
      tabs.push({key:'tpl_'+k, label:(subs[k].icon||'')+' '+subs[k].label});
    });
    if (cats.procedure_contact) tabs.push({key:'procedure_contact', label:'📨 手続きご連絡票'});
    if (cats.subsidy_consultation) tabs.push({key:'subsidy_consultation', label:'💴 助成金ご相談票'});
    tabsEl.innerHTML = tabs.map(function (t, i) {
      return '<button class="'+(i===0?'is-active':'')+'" data-tab="'+esc(t.key)+'" type="button">'+esc(t.label)+'</button>';
    }).join('');
  }

  function renderItem(it) {
    var doc = it.file_doc, pdf = it.file_pdf;
    var nameHtml = esc(it.name) + (it.no ? ' <span class="aq-form-no">(No.'+esc(String(it.no))+')</span>' : '');
    var use  = it.use ? '<p class="aq-form-use">'+esc(it.use)+'</p>' : '';
    var docLabel = (/\.xlsx?$/i.test(doc || '')) ? 'Excel' : 'Word';
    var docClass = (/\.xlsx?$/i.test(doc || '')) ? 'aq-form-open-xls' : 'aq-form-open-doc';
    var actions = '';
    if (doc) actions += '<a class="aq-form-open '+docClass+'" href="'+esc(urlEncodePath(doc))+'" download>📄 '+docLabel+' をダウンロード</a>';
    if (pdf) actions += '<a class="aq-form-open aq-form-open-pdf" href="'+esc(urlEncodePath(pdf))+'" download>📕 PDF をダウンロード</a>';
    if (!actions) actions = '<span class="aq-form-req-badge">準備中</span>';
    return '<div class="aq-form-card">' +
      '<div class="aq-form-body"><h3 class="aq-form-name">'+nameHtml+'</h3>'+use+'</div>' +
      '<div class="aq-form-actions">'+actions+'</div>' +
    '</div>';
  }

  function renderSubcatBlock(key, sub) {
    var items = sub.items || [];
    if (items.length === 0) return '';
    var html = '<section class="aq-forms-section">';
    html += '<h2 class="aq-forms-section-h"><span class="aq-forms-section-icon">'+esc(sub.icon||'')+'</span>'+esc(sub.label)+' <span class="aq-forms-count">'+items.length+'件</span></h2>';
    if (sub.desc) html += '<p class="aq-forms-section-desc">'+esc(sub.desc)+'</p>';
    html += '<div class="aq-forms-grid">';
    items.forEach(function (it) { html += renderItem(it); });
    html += '</div></section>';
    return html;
  }

  function render() {
    if (!sections) return;
    var html = '';
    var tpl  = cats.templates || {};
    var subs = tpl.subcategories || {};

    if (state.tab === 'all' || state.tab.indexOf('tpl_') === 0) {
      if (state.tab === 'all') {
        Object.keys(subs).forEach(function (k) { html += renderSubcatBlock(k, subs[k]); });
      } else {
        var key = state.tab.slice(4);
        if (subs[key]) html += renderSubcatBlock(key, subs[key]);
      }
    }

    if (state.tab === 'all' || state.tab === 'procedure_contact') {
      if (cats.procedure_contact) html += renderSubcatBlock('procedure_contact', cats.procedure_contact);
    }
    if (state.tab === 'all' || state.tab === 'subsidy_consultation') {
      if (cats.subsidy_consultation) html += renderSubcatBlock('subsidy_consultation', cats.subsidy_consultation);
    }

    sections.innerHTML = html || '<p class="aq-subpage-empty">該当する書式がありません。</p>';
  }

  if (tabsEl) tabsEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (!b) return;
    tabsEl.querySelectorAll('button').forEach(function (x) { x.classList.remove('is-active'); });
    b.classList.add('is-active');
    state.tab = b.getAttribute('data-tab');
    render();
  });

  buildTabs();
  render();
})();
</script>
