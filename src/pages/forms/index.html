{# meta:
title: お役立ち書式
body_class: aq-is-forms
data_page: forms
#}

<div id="aq-forms-wrap" class="aq-subpage-wrap"><main class="aq-subpage-main">

<header class="aq-subpage-hero">
  <div class="aq-subpage-hero-text">
    <p class="aq-hero-kicker">顧問先専用</p>
    <h1>お役立ち書式</h1>
    <p>労務管理で頻繁に使う各種書式をワンクリックでダウンロードできます (Word / Excel / PDF)。</p>
  </div>
</header>

<div id="aq-forms-cats"></div>

<p class="aq-subpage-note">※ 書式は一般的なひな形です。 個別の対応が必要なケースは担当者へご相談ください。</p>

</main></div>

<script id="aq-forms-data" type="application/json">__FORMS_DATA__</script>
<script>
(function () {
  var raw;
  try { raw = JSON.parse(document.getElementById('aq-forms-data').textContent); }
  catch (e) { raw = { categories: {} }; }

  var cats = raw.categories || {};
  var root = document.getElementById('aq-forms-cats');

  function esc(s){return String(s == null ? '' : s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function urlEncodePath(p) {
    return (p || '').split('/').map(encodeURIComponent).join('/');
  }

  function itemRow(it) {
    var doc = it.file_doc, pdf = it.file_pdf;
    var noLabel = it.no ? '<span class="aq-form-no-pill">No.'+esc(String(it.no))+'</span>' : '';
    var docLabel = (/\.xlsx?$/i.test(doc || '')) ? 'Excel' : 'Word';
    var docClass = (/\.xlsx?$/i.test(doc || '')) ? 'aq-form-open-xls' : 'aq-form-open-doc';
    var btns = '';
    if (doc) btns += '<a class="aq-form-open '+docClass+'" href="'+esc(urlEncodePath(doc))+'" download>'+docLabel+'</a>';
    if (pdf) btns += '<a class="aq-form-open aq-form-open-pdf" href="'+esc(urlEncodePath(pdf))+'" download>PDF</a>';
    if (!btns) btns = '<span class="aq-form-req-badge">準備中</span>';
    return '<div class="aq-form-row">' +
      '<div class="aq-form-row-name">'+noLabel+'<span class="aq-form-row-title">'+esc(it.name)+'</span></div>' +
      '<div class="aq-form-row-desc">'+esc(it.desc || it.use || '')+'</div>' +
      '<div class="aq-form-row-btns">'+btns+'</div>' +
    '</div>';
  }

  function subcatBlock(key, sub) {
    var items = sub.items || [];
    var rows = items.map(itemRow).join('');
    return '<details class="aq-form-subcat" data-key="'+esc(key)+'">' +
      '<summary class="aq-form-subcat-summary">' +
        '<span class="aq-form-subcat-icon">'+esc(sub.icon||'📄')+'</span>' +
        '<span class="aq-form-subcat-label">'+esc(sub.label)+'</span>' +
        '<span class="aq-form-subcat-count">'+items.length+'件</span>' +
        '<span class="aq-form-subcat-chevron">▼</span>' +
      '</summary>' +
      '<div class="aq-form-subcat-body">' + rows + '</div>' +
    '</details>';
  }

  function categoryBlock(parentLabel, parentDesc, parentIcon, body) {
    return '<section class="aq-form-cat">' +
      '<header class="aq-form-cat-header">' +
        '<h2><span class="aq-form-cat-icon">'+esc(parentIcon||'📁')+'</span>'+esc(parentLabel)+'</h2>' +
        (parentDesc ? '<p>'+esc(parentDesc)+'</p>' : '') +
      '</header>' +
      '<div class="aq-form-cat-body">' + body + '</div>' +
    '</section>';
  }

  function render() {
    var html = '';
    // 便利書式 (with subcategories — main category)
    if (cats.templates) {
      var tpl = cats.templates;
      var inner = '';
      Object.keys(tpl.subcategories || {}).forEach(function (k) {
        inner += subcatBlock(k, tpl.subcategories[k]);
      });
      html += categoryBlock(tpl.label || '便利書式', tpl.desc, '📚', inner);
    }
    // 手続きご連絡票
    if (cats.procedure_contact) {
      var pc = cats.procedure_contact;
      html += categoryBlock(pc.label, pc.desc, '📨',
        subcatBlock('procedure_contact', { label:'手続きご連絡票 一覧', icon:'📨', items: pc.items }));
    }
    // 助成金ご相談票
    if (cats.subsidy_consultation) {
      var sc = cats.subsidy_consultation;
      html += categoryBlock(sc.label, sc.desc, '💴',
        subcatBlock('subsidy_consultation', { label:'助成金ご相談票 一覧', icon:'💴', items: sc.items }));
    }
    root.innerHTML = html;
  }

  render();
})();
</script>
